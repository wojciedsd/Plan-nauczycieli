name: Publikuj stronę

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pobierz plan z EduPage (jeśli się nie uda, zostaje zapisany dane.json)
        run: node update-data.js || echo "Nie udało się pobrać nowych danych, używam zapisanego pliku dane.json"
      - name: Sprawdź, czy plik z danymi istnieje
        run: test -f dane.json
      - name: Przygotuj pliki strony
        run: |
          mkdir site
          cp index.html style.css script.js dane.json site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
