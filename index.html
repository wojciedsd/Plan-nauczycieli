<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4457ff">
  <title>Plan nauczyciela – ZS nr 2 Ostrzeszów</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    // Ustaw motyw zanim strona się narysuje, żeby nie było błysku.
    (function () {
      var t = null;
      try { t = localStorage.getItem("theme"); } catch (e) {}
      if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <header class="top">
    <div class="brand"><span class="logo">ZS2</span><span class="brand-name">Zespół Szkół nr 2 w Ostrzeszowie</span></div>
    <button id="theme" class="icon-btn" type="button" aria-label="Przełącz jasny i ciemny motyw">
      <svg class="i-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <main>
    <section class="hero" aria-label="Wyszukiwarka nauczyciela">
      <h1>Plan lekcji nauczyciela</h1>
      <p class="lead">Wpisz imię i nazwisko, a zobaczysz cały tydzień od poniedziałku do piątku.</p>

      <div class="field">
        <svg class="search-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" autocomplete="off" placeholder="np. Jan Kowalski" aria-label="Imię i nazwisko nauczyciela" disabled>
        <ul id="suggestions" role="listbox" hidden></ul>
      </div>
      <p id="status" class="status loading" role="status">Wczytuję dane z EduPage…</p>
    </section>

    <section id="result" hidden>
      <div class="teacher-head">
        <div id="avatar" class="avatar" aria-hidden="true"></div>
        <div>
          <h2 id="teacherName"></h2>
          <p id="teacherMeta"></p>
        </div>
        <p id="todayInfo" class="today-info"></p>
      </div>
      <div id="dayTabs" class="day-tabs" role="tablist" aria-label="Dzień tygodnia"></div>
      <div class="table-wrap">
        <div id="grid" class="week"></div>
      </div>
      <p class="note">Kolor kafelka zależy od przedmiotu. Lekcje co drugi tydzień mają oznaczenie „tydz. A/B”.</p>
    </section>
  </main>

  <footer>
    <button id="refresh" class="ghost" type="button">Odśwież dane z EduPage</button>
    <span id="updated"></span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
